<!doctype html>
<html>
<head><meta charset="utf-8"><title>Tafheem · Reader</title><link rel="stylesheet" href="style.css"></head>
<body>
<script src="common.js"></script><script>nav();</script>
<h1>Quran Reader</h1>
<p>
  Surah: <select id="surah"></select>
  <button id="load">Load verses</button>
</p>
<div id="verses"></div>
<h3>Word pop-up (raw JSON)</h3>
<pre id="word">tap a word above</pre>

<script>
// Populate surah dropdown from the API (works pre-seed; static list).
(async () => {
  const r = await api("/api/quran/surahs");
  const sel = document.getElementById("surah");
  (r.body.data || []).forEach((s) => {
    const o = document.createElement("option");
    o.value = s.surah_number;
    o.textContent = s.surah_number + " · " + s.name + " (" + s.ayah_count + ")";
    sel.appendChild(o);
  });
})();

document.getElementById("load").addEventListener("click", async () => {
  const surah = document.getElementById("surah").value;
  const wrap = document.getElementById("verses");
  wrap.innerHTML = "loading…";

  // Fetch verses (for translation line) AND words (for tappable tokens).
  // Words come straight from the word-by-word data, so positions always match
  // and waqf/pause marks in the verse text never misalign them.
  const [vr, wr] = await Promise.all([
    api("/api/quran/surah/" + surah),
    api("/api/quran/surah/" + surah + "/words"),
  ]);
  wrap.innerHTML = "";
  if (!vr.ok) { wrap.textContent = JSON.stringify(vr.body); return; }

  // Group words by ayah number.
  const wordsByAyah = {};
  (wr.body.data || []).forEach((w) => {
    (wordsByAyah[w.ayah_number] = wordsByAyah[w.ayah_number] || []).push(w);
  });

  (vr.body.data || []).forEach((v) => {
    const div = document.createElement("div");
    const head = document.createElement("p");
    head.innerHTML = "<b>" + v.surah_number + ":" + v.ayah_number + "</b> — " +
      (v.translation_en || "(no translation)");
    div.appendChild(head);

    const words = wordsByAyah[v.ayah_number] || [];
    if (!words.length) {
      const note = document.createElement("em");
      note.textContent = "(word data not loaded for this verse)";
      div.appendChild(note);
    }
    words.forEach((w) => {
      const b = document.createElement("button");
      b.textContent = w.arabic_text || "؟";
      b.style.margin = "2px";
      // Data is already loaded — show it directly, no extra request.
      b.addEventListener("click", () => show("word", w));
      div.appendChild(b);
    });
    div.appendChild(document.createElement("hr"));
    wrap.appendChild(div);
  });
});
</script>
</body>
</html>
