<!doctype html>
<html>
<head><meta charset="utf-8"><title>Tafheem · Dashboard</title><link rel="stylesheet" href="style.css"></head>
<body>
<script src="common.js"></script><script>nav();</script>
<h1>My Dashboard</h1>
<button id="load">Reload</button>
<h2>Private reflections</h2>
<div id="private"></div>
<h2>Public reflections</h2>
<pre id="public"></pre>
<h2>Bookmarks</h2>
<pre id="bookmarks"></pre>
<h2>Profile</h2>
<pre id="profile"></pre>
<script>
document.getElementById("load").addEventListener("click", load);
load();
async function load() {
  const d = await api("/api/dashboard");
  const priv = document.getElementById("private");
  priv.innerHTML = "";
  if (d.ok) {
    (d.body.data.private_reflections || []).forEach((r) => {
      const div = document.createElement("div");
      // r.body is sanitized server-side (safe as HTML); tags are escaped.
      div.innerHTML =
        "<b>" + r.surah_number + ":" + r.ayah_number + "</b>" +
        '<div class="reflection-body">' + (r.body || "") + "</div>" +
        "<small>tags: " + esc(JSON.stringify(r.tags)) + "</small> ";
      const btn = document.createElement("button");
      btn.textContent = "Make public";
      btn.addEventListener("click", () => publish(r.id));
      div.appendChild(btn);
      div.appendChild(document.createElement("hr"));
      priv.appendChild(div);
    });
    if (!(d.body.data.private_reflections || []).length) priv.textContent = "(none)";
    show("public", d.body.data.public_reflections);
    show("bookmarks", d.body.data.bookmarks);
  } else {
    show("private", { status: d.status, ...d.body });
  }
  const p = await api("/api/profile/me");
  show("profile", p.ok ? p.body.data : { status: p.status, ...p.body });
}

async function publish(id) {
  const r = await api("/api/reflections/" + id + "/publish", { method: "POST" });
  if (!r.ok) {
    // e.g. flagged by the pre-post keyword audit — surfaced to the user.
    alert((r.body && r.body.error && r.body.error.message) || "Publish failed");
  }
  load();
}
</script>
</body>
</html>
