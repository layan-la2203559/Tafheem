<!doctype html>
<html>
<head><meta charset="utf-8"><title>Tafheem · Moderation</title></head>
<body>
<script src="common.js"></script><script>nav();</script>
<h1>Moderation Dashboard</h1>
<p>(requires a moderator or admin account)</p>
<p>
  Queue:
  <button id="pending">Pending</button>
  <button id="reviewed">Reviewed</button>
  <button id="log">Audit log</button>
</p>
<div id="queue"></div>

<h2>Keyword flags (pre-post audit)</h2>
<p><input id="kw" placeholder="keyword"> <button id="addkw">Add (admin)</button></p>
<div id="keywords"></div>

<pre id="out"></pre>
<script>
document.getElementById("pending").addEventListener("click", () => loadQueue("pending"));
document.getElementById("reviewed").addEventListener("click", () => loadQueue("reviewed"));
document.getElementById("log").addEventListener("click", loadLog);
document.getElementById("addkw").addEventListener("click", addKeyword);
loadQueue("pending");
loadKeywords();

async function loadQueue(status) {
  const r = await api("/api/mod/queue?status=" + status);
  const wrap = document.getElementById("queue");
  wrap.innerHTML = "";
  if (!r.ok) { show("out", { status: r.status, ...r.body }); return; }
  (r.body.data || []).forEach((rep) => {
    const div = document.createElement("div");
    div.innerHTML = "<pre>" + JSON.stringify(rep, null, 2) + "</pre>";
    ["dismiss", "remove_content", "warn", "suspend", "ban"].forEach((action) => {
      const b = document.createElement("button");
      b.textContent = action;
      b.addEventListener("click", () => doAction(rep, action));
      div.appendChild(b);
    });
    div.appendChild(document.createElement("hr"));
    wrap.appendChild(div);
  });
}

async function doAction(rep, action) {
  const note = prompt("Note (optional)") || undefined;
  const r = await api("/api/mod/action", {
    method: "POST",
    body: JSON.stringify({
      report_id: rep.id,
      action,
      target_reflection_id: rep.reported_reflection_id || undefined,
      target_user_id: rep.reported_user_id || undefined,
      note,
    }),
  });
  show("out", { status: r.status, ...r.body });
  loadQueue("pending");
}

async function loadLog() {
  const r = await api("/api/mod/log");
  show("out", { status: r.status, ...r.body });
}

async function loadKeywords() {
  const r = await api("/api/mod/keywords");
  const wrap = document.getElementById("keywords");
  wrap.innerHTML = "";
  if (!r.ok) { wrap.textContent = JSON.stringify(r.body); return; }
  (r.body.data || []).forEach((k) => {
    const div = document.createElement("div");
    div.textContent = k.keyword + " ";
    const b = document.createElement("button");
    b.textContent = "delete (admin)";
    b.addEventListener("click", async () => {
      const d = await api("/api/mod/keywords/" + k.id, { method: "DELETE" });
      show("out", { status: d.status, ...d.body });
      loadKeywords();
    });
    div.appendChild(b);
    wrap.appendChild(div);
  });
}

async function addKeyword() {
  const r = await api("/api/mod/keywords", {
    method: "POST",
    body: JSON.stringify({ keyword: document.getElementById("kw").value }),
  });
  show("out", { status: r.status, ...r.body });
  loadKeywords();
}
</script>
</body>
</html>
